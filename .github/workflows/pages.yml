name: Deploy wiki site

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * *'   # nightly rebuild (after the local nightly ingest window)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs
        run: pip install mkdocs-material pyyaml
      - name: Generate nav + config, build site
        run: |
          python3 tools/gen-nav.py
          # Non-strict: log.md's exempt historical raw/ links warn by design
          mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
